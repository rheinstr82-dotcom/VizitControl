<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Учёт абонементов</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4C4A">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Абонементы">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --teal-dark: #0C3A38;
    --teal: #0F4C4A;
    --paper: #F6F1E4;
    --paper-dim: #EDE6D4;
    --amber: #E8A33D;
    --amber-dark: #C4801F;
    --rust: #B0503C;
    --ink: #20302E;
    --ink-soft: #5A6B65;
    --line: #DDD4BE;
    --avatar-1: #0F4C4A;
    --avatar-2: #C4801F;
    --avatar-3: #B0503C;
    --avatar-4: #3C6E71;
    --avatar-5: #8A5A3B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--paper);
  }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    padding-bottom: 110px;
    overflow-x: hidden;
  }
  .num, .display {
    font-family: 'Fraunces', Georgia, serif;
  }

  header {
    background: linear-gradient(160deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: var(--paper);
    padding: 20px 20px 22px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 10px rgba(12,58,56,0.18);
  }
  header h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 21px;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .back-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: var(--paper);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
    display: none;
    line-height: 1;
  }
  .container { padding: 18px 16px; max-width: 560px; margin: 0 auto; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    margin-top: 70px;
    line-height: 1.7;
    font-size: 15px;
  }
  .empty-state .big { font-size: 40px; display: block; margin-bottom: 10px; }

  /* --- Список людей --- */
  .person-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 13px 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 13px;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .person-card:active { transform: scale(0.985); }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 12px;
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
    font-family: 'Fraunces', serif;
  }
  .person-info { flex: 1; min-width: 0; }
  .person-name { font-weight: 600; font-size: 15.5px; }
  .person-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: var(--paper-dim);
    color: var(--teal);
  }
  .badge.zero { background: #F3E3DE; color: var(--rust); }
  .delete-btn {
    background: none; border: none; color: var(--ink-soft);
    font-size: 18px; cursor: pointer; padding: 8px;
    opacity: 0.6;
  }
  .delete-btn:active { color: var(--rust); opacity: 1; }

  /* --- Кнопки плавающие --- */
  .fab {
    position: fixed;
    bottom: 26px; right: 20px;
    width: 58px; height: 58px;
    border-radius: 18px;
    background: var(--amber);
    color: var(--teal-dark);
    border: none;
    font-size: 28px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(196,128,31,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { background: var(--amber-dark); }
  .fab-extended {
    position: fixed;
    bottom: 22px; left: 16px; right: 16px;
    max-width: 528px;
    margin: 0 auto;
    background: var(--amber);
    color: var(--teal-dark);
    border: none;
    border-radius: 16px;
    padding: 16px 22px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 6px 18px rgba(196,128,31,0.4);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .fab-extended:disabled { background: #D9D2BF; color: #9A917D; box-shadow: none; }

  /* --- Билет-абонемент --- */
  .ticket {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    display: flex;
    overflow: hidden;
    margin-bottom: 18px;
    box-shadow: 0 3px 14px rgba(32,48,46,0.06);
  }
  .ticket-main {
    flex: 1;
    padding: 20px;
    min-width: 0;
  }
  .ticket-title {
    font-size: 13px;
    color: var(--ink-soft);
    text-transform: none;
    margin-bottom: 2px;
  }
  .ticket-name { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  .ticket-remaining {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .ticket-remaining .num {
    font-size: 44px;
    font-weight: 600;
    line-height: 1;
    color: var(--teal);
  }
  .ticket-remaining .of {
    font-size: 15px;
    color: var(--ink-soft);
  }
  .ticket-meta { margin-top: 12px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .ticket-stub {
    width: 74px;
    flex-shrink: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0, transparent 6px,
      var(--paper-dim) 6px, var(--paper-dim) 13px
    );
    border-left: 2px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stub-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--paper);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .no-sub-card {
    background: #fff;
    border: 1px dashed var(--line);
    border-radius: 18px;
    padding: 26px 20px;
    text-align: center;
    margin-bottom: 18px;
  }
  .no-sub-card p { color: var(--ink-soft); font-size: 14px; margin: 0 0 14px; }

  .btn {
    background: var(--teal);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
  }
  .btn.secondary { background: var(--paper-dim); color: var(--teal); }
  .btn.full { width: 100%; }
  .btn:active { opacity: 0.85; }

  .message {
    padding: 11px 15px;
    border-radius: 12px;
    font-size: 13.5px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .message.ok { background: #E4EEE7; color: #2E6B4F; }
  .message.err { background: #F3E3DE; color: var(--rust); }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 22px 0 10px;
    color: var(--ink);
  }

  .visit-row {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 11px 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 14px;
  }
  .visit-stamp {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--paper-dim);
    color: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .visit-row .visit-date { flex: 1; }
  .visit-row button {
    background: none; border: none; color: var(--ink-soft);
    font-size: 16px; cursor: pointer; padding: 6px;
    opacity: 0.6;
  }
  .visit-row button:active { color: var(--rust); opacity: 1; }

  /* --- Модалки --- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,32,30,0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--paper);
    width: 100%;
    max-width: 560px;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px calc(28px + env(safe-area-inset-bottom));
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal h2 {
    font-family: 'Fraunces', serif;
    margin: 0 0 18px;
    font-size: 19px;
    font-weight: 600;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--teal); }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn { flex: 1; text-align: center; }

  .install-hint {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 15px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    display: none;
    align-items: center;
    gap: 10px;
  }
  .install-hint.show { display: flex; }
  .install-hint button {
    margin-left: auto;
    background: var(--teal);
    color: var(--paper);
    border: none;
    border-radius: 9px;
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn" onclick="showPeopleList()">← Назад</button>
  <h1 id="headerTitle">Учёт абонементов</h1>
</header>

<div class="container">
  <div class="install-hint" id="installHint">
    <span>Установите приложение на телефон для быстрого доступа</span>
    <button onclick="installApp()">Установить</button>
  </div>
  <div id="app"></div>
</div>

<!-- Модалка: добавить человека -->
<div class="overlay" id="personOverlay">
  <div class="modal">
    <h2>Новый человек</h2>
    <div class="field">
      <label>Имя</label>
      <input type="text" id="newPersonName" placeholder="Например, Иван Иванов">
    </div>
    <div class="field">
      <label>Телефон (необязательно)</label>
      <input type="tel" id="newPersonPhone" placeholder="+7 900 000-00-00">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('personOverlay')">Отмена</button>
      <button class="btn" onclick="submitAddPerson()">Добавить</button>
    </div>
  </div>
</div>

<!-- Модалка: новый абонемент -->
<div class="overlay" id="subOverlay">
  <div class="modal">
    <h2>Новый абонемент</h2>
    <div class="field">
      <label>Название</label>
      <input type="text" id="subTitle" value="Абонемент">
    </div>
    <div class="field">
      <label>Количество посещений</label>
      <input type="number" id="subVisits" value="8" min="1">
    </div>
    <div class="field">
      <label>Цена, € (необязательно)</label>
      <input type="number" id="subPrice" placeholder="0">
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal('subOverlay')">Отмена</button>
      <button class="btn" onclick="submitAddSubscription()">Создать</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'attendanceData';
const AVATAR_COLORS = ['var(--avatar-1)','var(--avatar-2)','var(--avatar-3)','var(--avatar-4)','var(--avatar-5)'];

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  return { people: [], subscriptions: [], visits: [] };
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let data = loadData();
let currentPersonId = null;
let checkInMessage = null;

function uid() { return Date.now() + Math.floor(Math.random() * 1000); }

function activeSubscriptionFor(personId) {
  return data.subscriptions
    .filter(s => s.personId === personId && s.isActive)
    .sort((a, b) => b.purchaseDate - a.purchaseDate)[0] || null;
}
function visitsFor(personId) {
  return data.visits.filter(v => v.personId === personId).sort((a, b) => b.dateTime - a.dateTime);
}

function formatDate(ms) { return new Date(ms).toLocaleDateString('ru-RU'); }
function formatDateTime(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString('ru-RU') + ' · ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}
function initials(name) {
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}
function avatarColor(id) { return AVATAR_COLORS[Math.abs(id) % AVATAR_COLORS.length]; }

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ---------- Люди ----------
function addPerson() { openModal('personOverlay'); }

function submitAddPerson() {
  const name = document.getElementById('newPersonName').value.trim();
  const phone = document.getElementById('newPersonPhone').value.trim();
  if (!name) return;
  data.people.push({ id: uid(), name, phone: phone || null, createdAt: Date.now() });
  saveData(data);
  document.getElementById('newPersonName').value = '';
  document.getElementById('newPersonPhone').value = '';
  closeModal('personOverlay');
  showPeopleList();
}

function deletePerson(personId, event) {
  event.stopPropagation();
  const person = data.people.find(p => p.id === personId);
  if (!confirm(`Удалить ${person.name}? Будут удалены все его абонементы и история посещений.`)) return;
  data.people = data.people.filter(p => p.id !== personId);
  data.subscriptions = data.subscriptions.filter(s => s.personId !== personId);
  data.visits = data.visits.filter(v => v.personId !== personId);
  saveData(data);
  showPeopleList();
}

// ---------- Абонементы ----------
function addSubscription() { openModal('subOverlay'); }

function submitAddSubscription() {
  const title = document.getElementById('subTitle').value.trim() || 'Абонемент';
  const visits = parseInt(document.getElementById('subVisits').value, 10);
  const priceRaw = document.getElementById('subPrice').value;
  const price = priceRaw ? parseFloat(priceRaw) : null;
  if (!visits || visits <= 0) return;

  data.subscriptions.forEach(s => {
    if (s.personId === currentPersonId && s.isActive) s.isActive = false;
  });
  data.subscriptions.push({
    id: uid(), personId: currentPersonId, title,
    totalVisits: visits, remainingVisits: visits,
    purchaseDate: Date.now(), price, isActive: true
  });
  saveData(data);
  closeModal('subOverlay');
  checkInMessage = null;
  showPersonDetail(currentPersonId);
}

// ---------- Посещения ----------
function checkIn() {
  const sub = activeSubscriptionFor(currentPersonId);
  if (!sub || sub.remainingVisits <= 0) {
    checkInMessage = { text: 'Нет активного абонемента с посещениями', ok: false };
    showPersonDetail(currentPersonId);
    return;
  }
  data.visits.push({ id: uid(), subscriptionId: sub.id, personId: currentPersonId, dateTime: Date.now() });
  sub.remainingVisits -= 1;
  saveData(data);
  checkInMessage = { text: 'Посещение отмечено', ok: true };
  showPersonDetail(currentPersonId);
}

function cancelVisit(visitId) {
  const visit = data.visits.find(v => v.id === visitId);
  if (!visit) return;
  data.visits = data.visits.filter(v => v.id !== visitId);
  const sub = data.subscriptions.find(s => s.id === visit.subscriptionId);
  if (sub) sub.remainingVisits += 1;
  saveData(data);
  showPersonDetail(currentPersonId);
}

// ---------- Экраны ----------
function showPeopleList() {
  currentPersonId = null;
  checkInMessage = null;
  document.getElementById('headerTitle').textContent = 'Учёт абонементов';
  document.getElementById('backBtn').style.display = 'none';

  const app = document.getElementById('app');
  if (data.people.length === 0) {
    app.innerHTML = `<div class="empty-state"><span class="big">🎫</span>Пока нет добавленных людей.<br>Нажмите + чтобы добавить.</div>`;
  } else {
    const sorted = [...data.people].sort((a,b) => a.name.localeCompare(b.name, 'ru'));
    app.innerHTML = sorted.map(person => {
      const sub = activeSubscriptionFor(person.id);
      const badge = sub
        ? `<span class="badge ${sub.remainingVisits === 0 ? 'zero' : ''}">${sub.remainingVisits} из ${sub.totalVisits}</span>`
        : `<span class="badge zero">нет абонемента</span>`;
      return `
        <div class="person-card" onclick="showPersonDetail(${person.id})">
          <div class="avatar" style="background:${avatarColor(person.id)}">${initials(person.name)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHtml(person.name)}</div>
            <div class="person-sub">${badge}</div>
          </div>
          <button class="delete-btn" onclick="deletePerson(${person.id}, event)">✕</button>
        </div>`;
    }).join('');
  }
  app.innerHTML += `<button class="fab" onclick="addPerson()">+</button>`;
}

function showPersonDetail(personId) {
  currentPersonId = personId;
  const person = data.people.find(p => p.id === personId);
  if (!person) { showPeopleList(); return; }

  document.getElementById('headerTitle').textContent = person.name;
  document.getElementById('backBtn').style.display = 'inline-flex';

  const sub = activeSubscriptionFor(personId);
  const visits = visitsFor(personId);

  let html = '';

  if (sub) {
    html += `
      <div class="ticket">
        <div class="ticket-main">
          <div class="ticket-title">${escapeHtml(sub.title)}</div>
          <div class="ticket-name">${escapeHtml(person.name)}</div>
          <div class="ticket-remaining">
            <span class="num">${sub.remainingVisits}</span>
            <span class="of">из ${sub.totalVisits} посещений</span>
          </div>
          <div class="ticket-meta">
            Куплен ${formatDate(sub.purchaseDate)}${sub.price ? ` · ${sub.price} €` : ''}
          </div>
        </div>
        <div class="ticket-stub">
          <div class="stub-icon">✓</div>
        </div>
      </div>
      <button class="btn secondary full" onclick="addSubscription()" style="margin-bottom:18px;">Оформить новый абонемент</button>
    `;
  } else {
    html += `
      <div class="no-sub-card">
        <p>У ${escapeHtml(person.name)} нет активного абонемента</p>
        <button class="btn" onclick="addSubscription()">Оформить абонемент</button>
      </div>
    `;
  }

  if (checkInMessage) {
    html += `<div class="message ${checkInMessage.ok ? 'ok' : 'err'}">${checkInMessage.text}</div>`;
  }

  html += `<div class="section-title">История посещений</div>`;
  if (visits.length === 0) {
    html += `<p style="color:var(--ink-soft); font-size:14px;">Посещений пока нет</p>`;
  } else {
    html += visits.map(v => `
      <div class="visit-row">
        <div class="visit-stamp">✓</div>
        <span class="visit-date">${formatDateTime(v.dateTime)}</span>
        <button onclick="cancelVisit(${v.id})" title="Отменить посещение">✕</button>
      </div>
    `).join('');
  }

  const canCheckIn = sub && sub.remainingVisits > 0;
  html += `<button class="fab-extended" ${canCheckIn ? '' : 'disabled'} onclick="checkIn()">✓ Отметить посещение</button>`;

  document.getElementById('app').innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- PWA: установка и офлайн ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installHint').classList.add('show');
});
function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(() => {
    deferredPrompt = null;
    document.getElementById('installHint').classList.remove('show');
  });
}
window.addEventListener('appinstalled', () => {
  document.getElementById('installHint').classList.remove('show');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

// Старт
showPeopleList();
</script>
</body>
</html>
